# Publishes a new Pokebox version whenever pokebox-game/version.json gets a new "version".
# Output = a GitHub Release v<version> with:
#   pokebox-game-<version>.zip  the game files (what the PC launcher and the Android app download)
#   Pokebox.exe                 the PC launcher, built from pokebox-game/tools/launcher
#   latest.json                 version, notes, sizes and SHA-256 checksums (what the apps check)
#   Pokebox.apk                 the Android app (card pictures are downloaded on the phone the first time they are shown)
# The APK is built on every push, so Java errors show up here even without a release.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build Pokebox.apk (game inside, card pictures fetched on the phone)
        run: |
          W=pokebox-android/app/src/main/assets/www/pokebox-game
          mkdir -p $W && rsync -a --exclude tools --exclude design --exclude '*.exe' --exclude '*.bat' --exclude '*.vbs' --exclude '*.lnk' pokebox-game/ $W/
          cd pokebox-android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --warning-mode=summary
          cp app/build/outputs/apk/release/app-release.apk ../Pokebox.apk && ls -la ../Pokebox.apk
          # guard: the APK must contain the app code (a .gitignore once dropped MainActivity and the app crashed on start)
          unzip -p ../Pokebox.apk 'classes*.dex' | grep -aq 'Lcom/pokebox/game/MainActivity;' || { echo 'MainActivity missing from APK'; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: Pokebox.apk, retention-days: 7 }

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          VER=$(jq -r .version pokebox-game/version.json)
          LAUNCHER=$(jq -r .launcher pokebox-game/version.json)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "launcher=$LAUNCHER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "v$VER already released — nothing to do"; fi
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists != '1'
        with: { go-version: '1.24' }
      - name: Build Pokebox.exe
        if: steps.v.outputs.exists != '1'
        working-directory: pokebox-game/tools/launcher
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui -X main.Version=${{ steps.v.outputs.launcher }}" -o ../../../dist/Pokebox.exe .
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.exists != '1'
        with: { name: apk, path: dist }
      - name: Package game + latest.json
        if: steps.v.outputs.exists != '1'
        run: |
          VER=${{ steps.v.outputs.ver }}; ZIP=pokebox-game-$VER.zip
          mkdir -p dist
          (cd pokebox-game && zip -qr -X ../dist/$ZIP . -x 'tools/*' 'design/*' '*.exe')
          sha() { sha256sum "$1" | cut -d' ' -f1; }; size() { stat -c %s "$1"; }
          jq -n --arg v "$VER" --arg l "${{ steps.v.outputs.launcher }}" --argjson minApk "$(jq .minApk pokebox-game/version.json)" \
                --argjson notes "$(jq .notes pokebox-game/version.json)" \
                --arg zn "$ZIP" --argjson zs "$(size dist/$ZIP)" --arg zh "$(sha dist/$ZIP)" \
                --argjson es "$(size dist/Pokebox.exe)" --arg eh "$(sha dist/Pokebox.exe)" \
                --argjson as "$(size dist/Pokebox.apk)" --arg ah "$(sha dist/Pokebox.apk)" \
                '{version:$v, launcher:$l, minApk:$minApk, notes:$notes, zip:{name:$zn,size:$zs,sha256:$zh}, exe:{name:"Pokebox.exe",size:$es,sha256:$eh}, apk:{name:"Pokebox.apk",size:$as,sha256:$ah}}' > dist/latest.json
          cat dist/latest.json
      - name: Publish release
        if: steps.v.outputs.exists != '1'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=${{ steps.v.outputs.ver }}
          jq -r '.notes | map("- " + .) | join("\n")' pokebox-game/version.json > notes.md
          printf '\n\n**PC:** download `Pokebox.exe` + the zip only for a fresh install — existing installs update from inside the game.\n**Android:** download `Pokebox.apk` on the phone and open it to install (allow \"install unknown apps\" once). After that the app updates itself; a new APK is only needed when the app says so.\n' >> notes.md
          gh release create "v$VER" dist/* --title "Pokebox $VER" --notes-file notes.md --latest

