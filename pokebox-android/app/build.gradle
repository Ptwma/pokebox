plugins { id 'com.android.application' }
android {
    namespace 'com.pokebox.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pokebox.game'
        minSdk 26
        targetSdk 34
        versionCode 4          // bump on every release so the APK installs over the old one (saves are kept)
        versionName '2.4'      // 2.0 = open world (Veyra), field battles, quests
    }
    // one fixed key for every build (GitHub Actions and build-apk.bat), so a new APK always installs over the old one.
    // It is public on purpose (fan project, updates only ever come from this repository's releases).
    signingConfigs {
        pokebox { storeFile file('../pokebox-release.jks'); storePassword 'pokebox-fan'; keyAlias 'pokebox'; keyPassword 'pokebox-fan' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.pokebox }
        debug { signingConfig signingConfigs.pokebox }
    }
    // the activity lives in ..\src-java (short path: the Claude file bridge can't reach deeper folders)
    sourceSets { main { java.srcDirs = ['../src-java'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // card images / models / wasm are already compressed: store them as-is (faster build, same size, faster loading)
    androidResources { noCompress 'jpg', 'jpeg', 'webp', 'png', 'glb', 'wasm', 'onnx', 'woff2', 'gif' }
    packaging { jniLibs { useLegacyPackaging false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
